<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TegakiTrainer v0.9.1</title>
  <link href="main.css?0_9_1" rel="stylesheet">
  <meta name="description" content="TegakiTrainer - 手書き要約筆記練習ツール">
  <meta property="og:title" content="TegakiTrainer">
  <meta property="og:description" content="手書き要約筆記練習ツール">
  <meta property="og:image" content="apple-touch-icon.png">
  <!-- for apple devices... -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TegakiTrainer">
  <!-- end of 'for apple devices' -->
  <link rel="icon" href="favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="app">
    <div id="tool" class="flex-fixed flex-h-center">
      <button id="speak-test-button" class="flex-fixed">声 : </button>
      <select id="voices" class="flex-grow"></select>
      <button id="log-open">log</button>
    </div>
    <div id="tool2" class="flex-fixed flex-h-center">
      <div id="remaining">
        <span>[</span><span id="remaining-time">-</span><span>秒</span><span>経過]</span>
      </div>
      <div>
        <span> [</span><span id="num-phrases">0</span><span>問終了]</span>
      </div>
    </div>
    <div id="description">
      <div id="description-text">
        ボタンを押すと、ランダムな例文を音声で読み上げます。
        <br>手書き表記例の長さに応じたカウントの後に表記例を示します。
        <br><span id="description-minutes">-</span>分経つと、練習終了です。
      </div>
      <div id="description-tool">
        <button id="open-op-test-dialog">音声テスト</button>
      </div>
    </div>
    <div id="result">
      <p><span id="result-period">-</span>秒間で<span id="result-phrases">-</span>問、<span id="result-graphemes">-</span>字ほど書きました。</p>
      <p>ペース<span id="result-speed">-</span>字/分（最高<span id="max-speed">-</span>字/分）</p>
      <p id="conguraturations" class="hide">新記録おめでとうございます！</p>
      <p>これまでの練習回数は<span id="exercise-count"></span>回です。</p>
      <div id="toolarea">
        <button id="erase-max-speed">成績を初期化</button>
        <button id="erase-exercise-count">回数を初期化</button>
      </div>
    </div>
    <div id="operation" class="flex-fixed flex-h-center">
      <button id="next">次の例文</button>
    </div>
    <div id="answer"></div>
    <!-- 効果音ラボ（https://soundeffect-lab.info/）のサウンドを利用させていただいてます -->
  </div>

  <dialog id="op-test-dialog">
    <div id="op-test-content">
      <div id="op-test-dialog-control">
        <button id="op-test-dialog-close">閉じる</button>
      </div>
      <div>音声合成テスト</div>
      <div id="op-test-text-container">
        <div id="op-test-text-number-container">[<span id="op-test-text-number"></span>] <span id="op-test-text"></span></div>
      </div>
      <div id="op-test-tool">
        <button id="op-test-prev">前の問題</button>
        <button id="op-test-play">音声を再生</button>
        <button id="op-test-next">次の問題</button>
      </div>
    </div>
  </dialog>

  <dialog id="log-dialog">
    <div id="log-content">
      <div id="log-text"></div>
      <button id="log-close">OK</button>
    </div>
  </dialog>

  <dialog id="not-available-dialog">
    <div id="in-app-browser-message">アプリ内ブラウザで開いているようです。標準のブラウザで開き直してください。</div>
    <div id="unavailable-browser-message">このブラウザでは音声が出せません。ChromeかSafariで開いてください。</div>
  </dialog>

  <script type="module" src="index.js?0_9_1"></script>
</body>
</html>
